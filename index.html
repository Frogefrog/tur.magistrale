<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тур Магистраль</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%235b1a73'/%3E%3Cpath d='M3 26L13 13l6 7 5-5.5L37 26z' fill='%23a8c42e'/%3E%3Cpath d='M15.4 40l3.4-15h2.4l3.4 15z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f4f5f9;--card:#fff;--ink:#1d2030;--mut:#7d8196;--line:#e6e8f0;--green:#a8c42e;--gd:#6f8a10;--purple:#5b1a73;--red:#ff4466;--soft:#eef0f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161d;--card:#1f2029;--ink:#eceef6;--mut:#9a9eb3;--line:#2f3140;--soft:#2a2c39;--gd:#b7d44a}}
:root[data-theme="dark"]{--bg:#15161d;--card:#1f2029;--ink:#eceef6;--mut:#9a9eb3;--line:#2f3140;--soft:#2a2c39;--gd:#b7d44a}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.45 Inter,system-ui,Arial,sans-serif}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.wrap{max-width:1176px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:26px;height:56px}
.logo{font-weight:800;color:var(--purple);font-size:18px}.logo span{color:var(--green)}
header nav{display:flex;gap:22px;flex:1;font-size:13px}
.btn-o{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:8px;font-weight:600}
.crumbs{color:var(--mut);font-size:12px;padding:14px 0}.crumbs a:hover{color:var(--ink)}
.hero{border-radius:20px;color:#fff;text-align:center;padding:54px 16px 40px;background:radial-gradient(circle at 18% 85%,#1c8c8c,transparent 45%),radial-gradient(circle at 82% 70%,#0f6b86,transparent 50%),linear-gradient(160deg,#27402f,#0b4a5c 55%,#12a2a0)}
.hero h1{font-size:clamp(26px,5vw,40px);margin:0 0 24px;font-weight:800}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:28px 0 32px}
.chip{background:var(--card);border-radius:12px;padding:0 14px;height:54px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;border:2px solid transparent;text-align:left}
.chip.on{border-color:var(--green)}
.main{display:grid;grid-template-columns:270px 1fr;gap:24px;align-items:start}
.filters{background:var(--card);border-radius:16px;padding:6px 16px}
.f{padding:14px 0;border-bottom:1px solid var(--line);font-size:13px}.f:last-child{border:0}
.f h4{margin:0 0 10px;font-size:13px}
.rng{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rng input,.f select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px}
.ck{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px;cursor:pointer}
.ck input{accent-color:var(--green);width:16px;height:16px}
.link{background:none;border:0;color:var(--gd);font-weight:700;padding:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;font-weight:600;flex-wrap:wrap}
.bar select{border:0;background:none;font-weight:700;cursor:pointer}
.fbtn{display:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.tour{background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s}
.tour:hover{transform:translateY(-3px)}
.ph{height:200px;position:relative;color:#fff;display:flex;align-items:flex-end;padding:12px;background-size:cover}
.tag{position:absolute;left:12px;top:12px;background:#fff;color:#1d2030;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600}
.heart{position:absolute;right:10px;top:8px;background:#0003;border:0;color:#fff;font-size:20px;width:36px;height:36px;border-radius:50%}
.heart.on{color:var(--red)}
.org{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;width:100%}
.org i{width:26px;height:26px;border-radius:50%;background:#fff8;border:2px solid #fff}
.disc{margin-left:auto;background:var(--red);border-radius:6px 6px 0 0;padding:6px 10px;font-size:12px;position:relative;bottom:-12px}
.info{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;gap:8px}
.rate{font-size:12px;color:var(--mut)}.rate b{color:var(--ink)}.rate:before{content:"★ ";color:var(--gd)}
.tour h3{margin:0;font-size:15px;font-weight:600;line-height:1.4}
.tour p{margin:0;color:var(--mut);font-size:12px}
.price{font-size:18px;font-weight:700;margin-top:auto}
.price s,.price em{color:var(--mut);font-size:12px;font-weight:500;font-style:normal;margin-left:4px}
.dates{display:flex;gap:6px;font-size:11px;color:var(--mut);flex-wrap:wrap}.dates span{background:var(--soft);padding:3px 7px;border-radius:5px}
.empty{grid-column:1/-1;background:var(--card);border-radius:16px;padding:40px;text-align:center;color:var(--mut)}
.banner{margin:40px 0 0;border-radius:16px;background:linear-gradient(100deg,#5b1a73 45%,#8a3aa8);color:#fff;padding:36px 40px}
.banner h2{font-size:26px;margin:0 0 8px}.banner p{margin:0;opacity:.85}
/* tour page */
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;gap:4px;border-radius:16px;overflow:hidden;height:300px}
.gal div{background-size:cover}
.t-head{margin:22px 0 18px}.t-head h1{margin:6px 0;font-size:28px;line-height:1.25}
.detail{display:grid;grid-template-columns:1fr 350px;gap:24px;align-items:start;margin-bottom:60px}
.panel{background:var(--card);border-radius:16px}
.tabs{display:flex;gap:28px;padding:18px 24px 0;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:56px;background:var(--card);border-radius:16px 16px 0 0;z-index:2}
.tabs a{color:var(--mut);padding-bottom:12px;white-space:nowrap;border-bottom:2px solid transparent}
.tabs a.on{color:var(--ink);border-color:var(--ink)}
.pad{padding:24px}.pad section{margin-bottom:34px}.pad h2{font-size:21px;margin:0 0 14px}
.perks{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:14px;padding:16px 0;margin-bottom:28px}
.perks div{padding:0 16px;font-weight:600;border-left:1px solid var(--line)}.perks div:first-child{border:0}
.perks small{display:block;color:var(--mut);font-weight:400;font-size:11px;margin-top:4px}
.det{background:var(--bg);border-radius:14px;padding:18px}
.det .g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.det .g>div{background:var(--card);border-radius:12px;padding:18px;display:grid;gap:16px}
.det small{display:block;color:var(--mut);font-size:12px}
.day{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.day button{width:100%;background:none;border:0;padding:16px 20px;font-weight:600;text-align:left;display:flex;justify-content:space-between}
.day button:after{content:"⌄";color:var(--mut);transition:transform .2s}.day.open button:after{transform:rotate(180deg)}
.day p{display:none;margin:0;padding:0 20px 18px;color:var(--mut)}.day.open p{display:block}
.route{display:flex;flex-wrap:wrap;gap:8px}.route span{background:var(--soft);padding:6px 12px;border-radius:20px;font-size:13px}
.route span:before{content:"📍 "}
ul.l{margin:0;padding:0;list-style:none}ul.l li{padding:6px 0 6px 26px;position:relative}
ul.l li:before{content:"✓";position:absolute;left:0;color:var(--gd);font-weight:800}
ul.l.no li:before{content:"✕";color:var(--red)}
.rev{background:var(--soft);border-radius:12px;padding:16px;margin-bottom:10px}.rev b{display:block;margin-bottom:4px}
.book{background:var(--card);border-radius:16px;padding:24px;position:sticky;top:76px}
.bp{font-size:24px;font-weight:700}.bp s{color:var(--mut);font-size:16px;margin:0 6px}
.bp u{text-decoration:none;background:var(--red);color:#fff;font-size:12px;padding:3px 7px;border-radius:5px;vertical-align:middle}
.bd{color:var(--mut);font-size:12px;margin:6px 0 16px}
.sel{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sel select{width:100%;border:0;background:var(--card);padding:15px 16px}
.sel .q{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:600}
.qty{display:flex;align-items:center;gap:14px}.qty button{width:34px;height:34px;border:0;border-radius:8px;background:var(--soft);font-size:18px}
.sum{display:flex;justify-content:space-between;margin:16px 0 0;font-weight:700;font-size:16px}
.cta{display:block;width:100%;border:0;background:var(--green);color:#fff;font-weight:700;font-size:16px;padding:16px;border-radius:10px;margin:16px 0}
.pre{text-align:center;font-size:12px;color:var(--mut)}.pre b{display:block;color:var(--gd);margin-bottom:4px;font-size:13px}
.err{color:var(--red);font-size:12px;min-height:16px;text-align:center}
.who{display:flex;align-items:center;gap:12px;margin-top:18px}.who i{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#c9a46a,#5e7d4a);border:2px solid var(--green)}
.who button{margin-left:auto;background:var(--purple);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:700}
.rel{margin-bottom:50px}.rel h2{font-size:21px}
dialog{border:0;border-radius:16px;padding:26px;width:min(420px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#000a}
dialog h3{margin:0 0 6px;font-size:20px}dialog label{display:block;margin:12px 0 4px;font-size:12px;color:var(--mut)}
dialog input,dialog textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:11px}
.row{display:flex;gap:8px;margin-top:18px}.row .cta{margin:0}.row .btn-o{flex:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:10px;font-weight:600;z-index:20}
footer{background:var(--card);padding:28px 0;color:var(--mut);font-size:12px}
@media (max-width:1000px){.main,.detail{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.chips{grid-template-columns:repeat(3,1fr)}.filters{display:none}.filters.show{display:block}.fbtn{display:inline-block}header nav{display:none}.book{position:static}.tabs{top:56px}}
@media (max-width:620px){.grid{grid-template-columns:1fr}.chips{grid-template-columns:repeat(2,1fr)}.perks,.det .g{grid-template-columns:1fr}.perks div{border:0;padding:8px 16px}.gal{grid-template-columns:1fr;height:220px}.gal div:nth-child(n+2){display:none}}
.dd{position:relative}.dd>button{background:none;border:0;padding:8px 0;font-weight:600;font-size:13px}
.dd>button span{display:inline-block;transition:transform .15s}.dd>button[aria-expanded=true] span{transform:rotate(180deg)}
.menu{display:none;position:absolute;top:100%;left:-14px;background:var(--card);border-radius:14px;box-shadow:0 12px 40px #0003;padding:10px;min-width:260px;z-index:10}
.menu a{display:block;padding:10px 12px;border-radius:8px;font-weight:600;font-size:13px}.menu a:hover{background:var(--soft)}
.dd.open .menu{display:block}

.hr2{display:flex;gap:18px;align-items:center;font-size:13px;font-weight:600}.hr2 select{border:0;background:none;font-weight:700;cursor:pointer}
.burger{display:none;border:0;background:none;font-size:22px}.mob{display:none}
.ph1{font-size:30px;margin:0 0 20px}.mut{color:var(--mut)}.lead{font-size:17px;max-width:640px;color:var(--mut);margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:50px}
.tile{background:var(--card);border-radius:14px;padding:20px;font-weight:700;display:block}.tile small{display:block;color:var(--mut);font-weight:500;margin-top:4px}.tile:hover{outline:2px solid var(--green)}
.two{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start;margin-bottom:60px}
.card2{background:var(--card);border-radius:16px;padding:24px}.card2 h3{margin:0 0 8px}
.card2 label{display:block;margin:12px 0 4px;font-size:12px;color:var(--mut)}
.card2 input,.card2 textarea,.card2 select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:11px;margin-top:4px}
.pts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 24px}.pts div{background:var(--card);border-radius:14px;padding:18px}.pts b{display:block;margin-bottom:6px}
.amt{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.amt button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 14px;font-weight:700}.amt button.on{border-color:var(--green);background:var(--green);color:#fff}
.cert{background:linear-gradient(135deg,#5b1a73,#a8c42e);color:#fff;border-radius:16px;padding:24px;margin-top:16px}.cert b{font-size:24px;letter-spacing:2px;display:block;margin:6px 0}
.art{background:var(--card);border-radius:16px;padding:22px;display:block}.art h3{margin:4px 0 6px}
.prose{max-width:700px;background:var(--card);border-radius:16px;padding:28px;margin-bottom:50px}.prose p{margin:0 0 14px}
@media (max-width:1000px){.burger{display:block}#nav{display:none;position:absolute;top:56px;left:0;right:0;background:var(--card);flex-direction:column;gap:0;padding:8px 16px 16px;max-height:80vh;overflow:auto;box-shadow:0 12px 30px #0003}#nav.show{display:flex}.menu{position:static;box-shadow:none;padding:0 0 0 12px;min-width:0}.mob{display:block;padding:10px 0}.hr2 a:not(.fv){display:none}.two{grid-template-columns:1fr}.pts{grid-template-columns:1fr}header .wrap{gap:12px}}
html{-webkit-text-size-adjust:100%}body{-webkit-tap-highlight-color:transparent}
header .wrap{max-width:1320px}
.dd{height:56px;display:flex;align-items:center}
.dd>button{position:relative;height:100%;padding:0 2px}
.dd>button:after{content:"";position:absolute;left:2px;right:2px;bottom:10px;height:2px;background:var(--green);transform:scaleX(0);transition:transform .2s}
.dd:hover>button:after,.dd.open>button:after{transform:scaleX(1)}
.menu{display:block;opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .15s,transform .15s,visibility .15s;top:100%;left:-14px}
.dd.open .menu{opacity:1;visibility:visible;transform:none}

a.cta{text-align:center}.cta.vk{background:#0077ff}.cta.tg{background:#229ed9}.cta.mail{background:var(--purple)}
dialog.pk{width:min(460px,94vw);padding:24px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px}.mh h3{margin:0 auto;font-size:20px}.x{border:0;background:none;font-size:20px;width:36px;height:36px;border-radius:50%;color:var(--mut)}.x:hover{background:var(--soft)}
.pl{margin:14px 0 10px;font-size:15px;line-height:1.5}.pt{margin:0;color:var(--mut);font-size:12px;font-weight:600}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:6px;margin:18px 0 14px}
.seg3 button{border:0;background:none;padding:12px 4px;border-radius:9px;font-weight:700}.seg3 .on{background:var(--card);box-shadow:0 1px 4px #0002}
.ph-row{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ph-row select{border:0;background:var(--card);padding:0 8px;width:104px;border-right:1px solid var(--line)}.ph-row input{border:0;flex:1;min-width:0;background:var(--card)}
#pf input:not(.x),#pf textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px}
.ph-row input{border:0!important;border-radius:0!important}
#pf textarea{margin-top:10px;resize:vertical}
.chans{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.chans button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:9px 14px;font-weight:700}.chans .on{background:var(--green);border-color:var(--green);color:#fff}
.legal{font-size:11px;color:var(--mut);text-align:center;margin:0}.legal a{text-decoration:underline}
.h2{font-size:22px;margin:40px 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}.stats div{background:var(--card);border-radius:14px;padding:20px;color:var(--mut)}.stats b{display:block;font-size:30px;color:var(--ink);font-weight:800}
.pts.c4{grid-template-columns:repeat(4,1fr)}
.tl{border-left:2px solid var(--line);margin-left:6px;max-width:640px}.tl div{position:relative;padding:0 0 20px 24px}.tl div:before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--green)}.tl b{display:block}
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.team>div{background:var(--card);border-radius:14px;padding:20px;text-align:center}.team small{display:block;color:var(--mut)}
.av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;color:#fff;font-weight:800;font-size:22px;font-style:normal}
.cta-box{background:linear-gradient(100deg,#5b1a73,#8a3aa8);color:#fff;border-radius:16px;padding:32px;margin:40px 0 60px}.cta-box h3{margin:0 0 6px;font-size:22px}.cta-box p{margin:0 0 16px;opacity:.85}.cta-box .cta{margin:0;max-width:260px}
.mbar{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));gap:12px;align-items:center;justify-content:space-between;z-index:6}
.mbar b{font-size:18px}.mbar button{border:0;background:var(--green);color:#fff;font-weight:700;border-radius:10px;padding:13px 24px;font-size:15px}
@media (pointer:coarse){.menu a,.chip,.btn-o,.chans button,.seg3 button{min-height:44px}.qty button{width:44px;height:44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:1240px){header .wrap{gap:16px}#nav{gap:16px}.hr2{gap:12px}}
@media (max-width:1000px){
.menu{display:none;opacity:1;visibility:visible;transform:none;top:auto}.dd.open .menu{display:block}
.dd{height:auto;display:block;border-bottom:1px solid var(--line)}.dd>button{width:100%;text-align:left;padding:14px 0;height:auto;font-size:15px}.dd>button:after{display:none}
.dd>button:before{content:"+";float:right;color:var(--mut);font-size:18px}.dd.open>button:before{content:"−"}
.menu a{padding:12px 4px;font-size:14px}
.mob{font-size:15px;font-weight:600;border-bottom:1px solid var(--line);padding:14px 0}
.burger{order:-1;font-size:24px;width:44px;height:44px;color:var(--ink)}.hr2{margin-left:auto}#login{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbar{display:flex}footer{padding-bottom:92px}
.pts,.pts.c4{grid-template-columns:repeat(2,1fr)}.stats,.team{grid-template-columns:repeat(2,1fr)}
.ph{height:180px}.gal{height:240px}.hero{padding:40px 16px 30px}
}
@media (max-width:620px){
input,select,textarea{font-size:16px}
.wrap{padding:0 12px}.hero h1{margin-bottom:18px}.grid{gap:16px}.ph{height:200px}
.pts,.pts.c4,.stats,.team{grid-template-columns:1fr}.stats b{font-size:26px}
.bar{flex-direction:column;align-items:flex-start}
.t-head h1{font-size:22px}.tabs{gap:20px;padding:14px 16px 0}.pad{padding:16px}.book{padding:18px}
.logo{font-size:15px}header .wrap{gap:8px}.hr2 select{max-width:64px}
dialog{width:100%!important;max-width:100%;margin:auto 0 0;border-radius:20px 20px 0 0;max-height:92vh;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.cta-box{padding:24px}.cta-box .cta{max-width:none}.banner{padding:24px}
}
:root{--mapbg:#dbe7cb;--water:#9fd0e8;--hill:#c4d1a4;--cont:#6f8a4a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mapbg:#202b25;--water:#1e4a63;--hill:#2b3a2f;--cont:#4d6a50}}
:root[data-theme="dark"]{--mapbg:#202b25;--water:#1e4a63;--hill:#2b3a2f;--cont:#4d6a50}
.tour{position:relative}

function card(t){return `<article class="tour"><a href="#/tour/${t.id}" style="display:flex;flex-direction:column;flex:1">
<div class="ph" style="background:${t.g}"><span class="tag">${t.type}</span><div class="org"><i></i>${t.org}${t.o?`<span class="disc">−${disc(t)}%</span>`:''}</div></div>
<div class="info"><div class="rate"><b>${t.r.toFixed(1)}</b> (${t.n} отзывов) · ${t.c}</div><h3>${t.t}</h3><p>${t.s}</p>
<div class="price">${rub(t.p)}${t.o?`<s>${rub(t.o)}</s>`:''} <em>/ ${t.d} ${pl(t.d)}</em></div>
<div class="dates">${t.dates.slice(0,2).map(d=>`<span>${d[0]}</span>`).join('')}${t.dates.length>2?`<span>+${t.dates.length-2}</span>`:''}</div></div></a>
<button class="heart ${fav.includes(t.id)?'on':''}" data-fav="${t.id}" aria-label="В избранное" style="position:absolute;display:none"></button></article>`}

function filtered(){let r=T.filter(t=>{
 const q=F.q.trim().toLowerCase();
 if(q&&!hay(t).includes(q))return false;
 if(F.m&&!t.dates.some(d=>d[1]==F.m))return false;
 if(t.d<F.min||t.d>F.max)return false;
 if(F.types.length&&!F.types.includes(t.type))return false;
 if(F.disc&&!t.o)return false;
 if(F.rate&&t.r<4.9)return false;
 if(F.preset=='hot'&&!(t.o&&disc(t)>=10))return false;if(F.preset=='weekend'&&t.d>3)return false;if(F.preset=='oneday'&&t.d!=1)return false;if(F.fav&&!fav.includes(t.id))return false;return true});
 const s={pop:(a,b)=>b.n-a.n,cheap:(a,b)=>a.p-b.p,exp:(a,b)=>b.p-a.p,rate:(a,b)=>b.r-a.r,disc:(a,b)=>disc(b)-disc(a)}[F.sort];
 return r.sort(s)}

<div class="f"><label class="ck"><input type="checkbox" id="disc" ${F.disc?'checked':''}>Только со скидками</label><label class="ck"><input type="checkbox" id="rate" ${F.rate?'checked':''}>Рейтинг 4.9 и выше</label></div>
<div class="f"><button class="link" id="reset">Сбросить все фильтры</button></div></div></aside>
<section><div class="bar"><div id="cnt"></div><label>Сортировать: <select id="sort">${[['pop','По популярности'],['cheap','Сначала дешёвые'],['exp','Сначала дорогие'],['rate','По рейтингу'],['disc','По скидке']].map(o=>`<option value="${o[0]}" ${F.sort==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label></div>
<div class="grid" id="grid"></div>
<div class="banner"><h2>Более 220 локаций и направлений</h2><p>Организаторы проходят проверку, оплата любой картой, предоплата от 20%.</p></div></section></div>`;

 $('#m').onchange=()=>{F.m=+$('#m').value;list()};
 $('#min').oninput=e=>{F.min=+e.target.value||1;list()};$('#max').oninput=e=>{F.max=+e.target.value||32;list()};

}
function list(){const r=filtered();

 document.querySelectorAll('.tour').forEach((el,i)=>{const t=r[i];el.style.position='relative';
  const h=document.createElement('button');h.className='heart'+(fav.includes(t.id)?' on':'');h.textContent=fav.includes(t.id)?'♥':'♡';h.setAttribute('aria-label','В избранное');

}
function toggleFav(id){fav=fav.includes(id)?fav.filter(x=>x!=id):[...fav,id];saveFav();toast(fav.includes(id)?'Добавлено в избранное':'Убрано из избранного')}

   ot=setTimeout(()=>dds.forEach(x=>{x.classList.toggle('open',x==d);x.firstChild.setAttribute('aria-expanded',String(x==d))}),other?170:50)};

function filtered(){const q=F.q.trim().toLowerCase();

  if(F.ppl&&M.max<F.ppl)return false;if(F.grp&&M.max>F.grp)return false;
  if(F.country&&EX[t.id][0]!=F.country)return false;

function F0(){return {q:'',m:0,df:0,dt:0,kind:'multi',min:1,max:32,pmin:0,pmax:0,types:[],lod:[],stars:[],comf:[],act:[],meals:[],ppl:0,grp:0,country:'',age:0,kids:false,disc:false,rate:false,guar:false,ind:false,revs:false,op:false,nv:false,fav:false,sort:'pop',preset:''}}
function checks(){const C=[],q=F.q.trim().toLowerCase(),add=(n,f)=>C.push([n,f]),ag=t=>t.age.split('–').map(Number);
 if(F.kind=='multi')add('многодневные',t=>t.d>=2);
 if(F.kind=='one')add('однодневные',t=>t.d==1);
 if(F.kind=='odd')add('необычные',t=>ODD.includes(t.type));
 if(q)add('запрос «'+F.q.trim()+'»',t=>hay(t).includes(q));
 if(F.m)add('месяц',t=>t.dates.some(d=>d[1]==F.m));
 if(F.df)add('даты',t=>t.dates.some(d=>{const s=dparse(d)[0];return s>=F.df&&s<=F.dt+MS-1}));
 if(F.min>1||F.max<32)add('длительность',t=>t.d>=F.min&&t.d<=F.max);
 if(F.pmin||F.pmax)add('бюджет',t=>(!F.pmin||t.p>=F.pmin)&&(!F.pmax||t.p<=F.pmax));
 if(F.types.length)add('тип тура',t=>F.types.includes(t.type));
 if(F.lod.length)add('проживание',t=>F.lod.some(x=>META[t.id].lod.includes(x)));
 if(F.stars.length)add('категория отеля',t=>{const st=META[t.id].st;return F.stars.map(Number).includes(st>0&&st<=2?2:st)});
 if(F.comf.length)add('комфорт',t=>F.comf.includes(t.comf));
 if(F.act.length)add('активность',t=>F.act.includes(t.act));
 if(F.meals.length)add('питание',t=>F.meals.includes(META[t.id].meals));
 if(F.ppl)add('число мест',t=>META[t.id].max>=F.ppl);
 if(F.grp)add('размер группы',t=>META[t.id].max<=F.grp);
 if(F.country)add('страна',t=>EX[t.id][0]==F.country);
 if(F.age)add('возраст',t=>{const a=ag(t);return F.age>=a[0]&&F.age<=a[1]});
 if(F.kids)add('с детьми',t=>ag(t)[0]<=6);
 if(F.disc)add('скидка',t=>!!t.o);
 if(F.rate)add('рейтинг',t=>t.r>=4.9);
 if(F.guar)add('гарантия',t=>!!META[t.id].g);
 if(F.ind)add('индивидуальный формат',t=>!!META[t.id].i);
 if(F.revs)add('отзывы',t=>t.n>=50);
 if(F.op)add('туроператор',t=>!!META[t.id].op);
 if(F.nv)add('без визы',t=>!!META[t.id].nv);
 if(F.preset=='hot')add('горящие',t=>t.o&&disc(t)>=10);
 if(F.preset=='weekend')add('выходные',t=>t.d<=3);
 if(F.preset=='oneday')add('однодневные',t=>t.d==1);
 return C}
function ranked(){const C=checks(),base=F.fav?T.filter(t=>fav.includes(t.id)):T;return base.map(t=>({t,miss:C.filter(c=>!c[1](t)).map(c=>c[0])}))}

 if(ex.length<MINR&&!F.fav)near=rk.filter(x=>x.miss.length).sort((a,b)=>a.miss.length-b.miss.length||b.t.n-a.t.n).slice(0,MINR-ex.length);
 return {ex,near}}
function filtered(){return results().ex}

function pills(){const p=[],add=(l,f)=>p.push([l,f]);

 if(F.min>1||F.max<32)add(F.min+'–'+F.max+' дн.',()=>{F.min=1;F.max=32});
 if(F.pmin||F.pmax)add((F.pmin?rub(F.pmin):'0')+' – '+(F.pmax?rub(F.pmax):'∞'),()=>{F.pmin=0;F.pmax=0});
 if(F.ppl)add(F.ppl+' чел.',()=>F.ppl=0);
 if(F.grp)add('группа до '+F.grp,()=>F.grp=0);
 if(F.country)add(F.country,()=>F.country='');
 if(F.age)add('возраст '+F.age,()=>F.age=0);
 [['types',x=>x],['lod',x=>x],['stars',x=>(x==2?'1–2':x)+'★'],['meals',x=>x],['comf',x=>x],['act',x=>x]].forEach(([k,f])=>F[k].forEach(v=>add(f(v),()=>F[k]=F[k].filter(y=>y!=v))));

 if(F.df){const d=new Date(F.df);CAL.off=Math.max(0,Math.min(17,(d.getFullYear()-NOW.getFullYear())*12+d.getMonth()-NOW.getMonth()))}else CAL.off=0;
 $('#pop').hidden=false;$('#pbd').hidden=false;$('#dw').setAttribute('aria-expanded','true');$('#dw').classList.add('act');document.body.classList.add('lockm');popRender()}
function closePop(){const p=$('#pop');if(!p||p.hidden)return;p.hidden=true;$('#pbd').hidden=true;$('#dw').setAttribute('aria-expanded','false');$('#dw').classList.remove('act');document.body.classList.remove('lockm')}
function popClick(e){const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.tab!==undefined){CAL.tab=d.tab;popRender()}
 else if(d.nv!==undefined){CAL.off=Math.max(0,Math.min(17,CAL.off+ +d.nv));popRender()}
 else if(d.ts!==undefined){const ts=+d.ts;if(CAL.a==null||CAL.b!=null||ts<CAL.a){CAL.a=ts;CAL.b=null}else CAL.b=ts;
  F.m=0;F.df=CAL.a;F.dt=CAL.b!=null?CAL.b:9e15;dateUi();list();popRender()}
 else if(d.mo!==undefined){F.m=+d.mo;F.df=0;F.dt=0;CAL.a=CAL.b=null;dateUi();list();closePop()}
 else if(b.hasAttribute('data-rs')){F.m=0;F.df=0;F.dt=0;CAL.a=CAL.b=null;dateUi();list();popRender()}
 else if(b.hasAttribute('data-ok')){closePop();const g=$('#grid');if(g&&g.scrollIntoView)g.scrollIntoView({behavior:'smooth',block:'start'})}
 else if(b.hasAttribute('data-cl'))closePop()}

/* ---- подсказки «Куда?» ---- */
function sgHide(){const s=$('#sg');if(s)s.hidden=true}
function sgShow(){const sg=$('#sg'),qi=$('#q');if(!sg||!qi)return;const v=qi.value.trim().toLowerCase(),cnt=s=>T.filter(t=>hay(t).includes(s.toLowerCase())).length;
 const items=SUG.filter(s=>!v||s.toLowerCase().includes(v)).slice(0,v?8:7);
 sg.innerHTML=items.length?`<div class='sgh'>${v?'Подходящие направления':'Популярные направления'}</div>`+items.map(s=>{const c=cnt(s);return `<button type='button' data-sg="${esc(s)}"><i>📍</i><span><b>${esc(s)}</b><small>${c} ${pt(c)}</small></span></button>`}).join(''):`<div class='sgh'>Такого направления пока нет, но мы подберём похожие туры</div>`;
 sg.hidden=false}
function doSearch(){sgHide();closePop();F.q=$('#q').value;
 if(F.q.trim()&&F.kind&&!filtered().length){const k=F.kind;F.kind='';if(filtered().length)toast('Показали все типы туров');else F.kind=k}
 list();const g=$('#grid');if(g&&g.scrollIntoView)g.scrollIntoView({behavior:'smooth',block:'start'})}
addEventListener('mousedown',e=>{if(!e.target||!e.target.closest)return;const p=$('#pop');if(p&&!p.hidden&&!e.target.closest('#pop')&&!e.target.closest('#dw'))closePop();const s=$('#sg');if(s&&!s.hidden&&!e.target.closest('#sq'))sgHide()});
addEventListener('keydown',e=>{if(e.key=='Escape'){closePop();sgHide()}});

function resetAll(){const f=F.fav,k=F.kind;Object.assign(F,F0());F.fav=f;F.kind=k;CAL.a=CAL.b=null;paint();list()}

function paint(){const fl=$('#fl');if(!fl)return;const rt=CUR.R[CUR.code][0];
 fl.querySelectorAll('[data-k]').forEach(i=>i.checked=!!F[i.dataset.k]);
 fl.querySelectorAll('[data-m]').forEach(i=>i.checked=F[i.dataset.m].map(String).includes(i.value));
 fl.querySelectorAll('[data-n]').forEach(i=>i.value=F[i.dataset.n]||'');
 fl.querySelectorAll('[data-s]').forEach(i=>i.value=F[i.dataset.s]);
 fl.querySelectorAll('[data-p]').forEach(i=>i.value=F[i.dataset.p]?Math.round(F[i.dataset.p]*rt):'');
 fl.querySelectorAll('[data-pb]').forEach(b=>{const x=PB[+b.dataset.pb];b.classList.toggle('on',F.pmin==x[0]&&F.pmax==x[1])});
 $('#pp').textContent=F.ppl?F.ppl+' чел.':'Любое';$('#q').value=F.q;dateUi()}

function list(){const {ex,near}=results(),p=pills();
 $('#cnt').innerHTML=(F.fav?'Избранное: ':'Найдено ')+`<b>${ex.length}</b> ${pt(ex.length)}`+(near.length?` <span class='mut'>· и ещё ${near.length} похожих</span>`:'');
 $('#rn').textContent=p.length;$('#rs').hidden=!p.length;$('#fc').textContent=p.length?'('+p.length+')':'';
 $('#fap').textContent='Показать туры ('+(ex.length+near.length)+')';
 $('#pills').innerHTML=p.map((x,i)=>`<button class='pill' data-pi='${i}'>${x[0]} ✕</button>`).join('');
 $('#pills').onclick=e=>{const b=e.target.closest('button');if(!b)return;p[+b.dataset.pi][1]();paint();list()};
 $('#grid').className='grid'+(F.view=='list'?' list':'');
 let h=ex.map(t=>card(t)).join('');
 if(near.length)h+=`<div class='note'><b>${ex.length?'Точно подходит: '+ex.length+' '+pt(ex.length)+'.':'Точных совпадений нет.'}</b> Чтобы вы не остались ни с чем, мы добавили ближайшие варианты: на каждом отмечено, что именно не совпадает. <button class='link' id='e2' type='button'>Сбросить фильтры</button></div>`+near.map(x=>card(x.t,x.miss)).join('');
 if(!h)h=`<div class='empty'>В избранном пока пусто. <a class='link' href='#/all'>Смотреть туры</a></div>`;
 $('#grid').innerHTML=h;if($('#e2'))$('#e2').onclick=resetAll;
 document.querySelectorAll('.chip').forEach(b=>{const k=b.dataset.chip;b.classList.toggle('on',k=='short'?F.max==3:TOG[k]!==undefined?!!F[k]:F.types.includes(k))});
 document.querySelectorAll('.kinds button').forEach(b=>{const on=b.dataset.kind==F.kind;b.classList.toggle('on',on);b.setAttribute('aria-selected',String(on))});
 document.querySelectorAll('.vw button').forEach(b=>b.classList.toggle('on',b.dataset.v==F.view))}

function home(){document.title='Тур Магистраль — туры и приключения';
 const ck=(m,v,l)=>`<label class='ck'><input type='checkbox' data-m='${m}' value='${v}'>${l||v}</label>`;
 const tg=(k,l,tip)=>`<label class='tgl'><span>${l}${tip?` <i class='tip' title='${tip}'>ⓘ</i>`:''}</span><input type='checkbox' data-k='${k}'><b class='sw'></b></label>`;
 const dt=(t,b,o)=>`<details class='fd' ${o?'open':''}><summary>${t}</summary><div class='fb'>${b}</div></details>`;
 const countries=[...new Set(Object.values(EX).map(e=>e[0]))].sort();
 let rec=[];try{rec=JSON.parse(localStorage.getItem('rec')||'[]')}catch(e){}
 const side=`<div class='fh'><b>Фильтры</b><button type='button' class='x' id='fx' aria-label='Закрыть'>✕</button></div>
<div class='f0'><label class='ck'><input type='checkbox' data-k='disc'>Только со скидками</label></div>
${dt('Бюджет, за человека',`<div class='rng'><input type='number' min='0' inputmode='numeric' data-p='pmin' placeholder='от' aria-label='Цена от'><input type='number' min='0' inputmode='numeric' data-p='pmax' placeholder='до' aria-label='Цена до'></div><div class='pbs'>${PB.map((b,i)=>`<button type='button' data-pb='${i}'>${lab(b[0],b[1])}</button>`).join('')}</div>`,1)}
${dt('Длительность, дней',`<div class='rng'><input type='number' min='1' max='32' data-n='min' aria-label='От'><input type='number' min='1' max='32' data-n='max' aria-label='До'></div>`,1)}
${dt('Сколько вас человек',`<div class='step'><button type='button' data-ppl='-1' aria-label='Меньше'>−</button><b id='pp'>Любое</b><button type='button' data-ppl='1' aria-label='Больше'>+</button></div><p class='hint'>Покажем туры, где хватит мест для вашей компании</p>`)}
${dt('Максимальное кол-во участников',`<select data-s='grp'><option value='0'>Любое</option>${[6,10,15,25].map(n=>`<option value='${n}'>до ${n} человек</option>`).join('')}</select>`)}
<div class='tgls'>${tg('guar','Гарантированный тур','Тур состоится при любом количестве записавшихся')}${tg('ind','Доступен индивидуальный тур','Можно заказать поездку только для своей компании')}${tg('rate','Туры с высоким рейтингом','Рейтинг 4.9 и выше')}${tg('revs','Туры с отзывами','Не менее 50 отзывов')}${tg('op','Туры от туроператоров','Организатор — юридическое лицо')}${tg('nv','Без визы','Для граждан РФ')}</div>
${dt('Тип тура',types.map(t=>ck('types',t)).join(''),1)}
${dt('Страна',`<select data-s='country'><option value=''>Любая</option>${countries.map(c=>`<option>${c}</option>`).join('')}</select>`)}
${dt('Категория отеля',`<div class='stars'>${[2,3,4,5].map(s=>`<label><input type='checkbox' data-m='stars' value='${s}'><span>${s==2?'1–2':s} ★</span></label>`).join('')}</div>`,1)}
${dt('Тип проживания',LODS.slice(0,5).map(l=>ck('lod',l)).join('')+`<div class='more' hidden>${LODS.slice(5).map(l=>ck('lod',l)).join('')}</div><button type='button' class='all' id='alt'>Все типы (${LODS.length})</button>`,1)}
${dt('Питание',MEALS.map(l=>ck('meals',l)).join(''))}
${dt('Комфорт',COMF.map(l=>ck('comf',l)).join(''))}
${dt('Активность',ACT.map(l=>ck('act',l)).join(''))}
${dt('Возраст группы',`<input type='number' min='1' max='90' data-n='age' placeholder='Возраст участника' aria-label='Возраст'>${tg('kids','Можно с детьми','Подходит детям до 6 лет')}`)}
<div class='fa'><button type='button' class='cta' id='fap'>Показать туры</button></div>`;
 const chips=[['disc','🏷️','Скидки'],['rate','⭐','Высокий рейтинг'],['nv','🛂','Без визы'],['kids','👨‍👩‍👧','С детьми'],['short','🗓️','На выходные'],['Горный','⛰️','В горы'],['Горнолыжный','⛷️','Горные лыжи'],['Яхтинг','⛵','Яхтинг']];
 const IS=`<svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' aria-hidden='true'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>`,IC=`<svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' aria-hidden='true'><rect x='3' y='5' width='18' height='16' rx='3'/><path d='M3 10h18M8 3v4M16 3v4'/></svg>`;
 $('#app').innerHTML=`<div class='crumbs'>Главная · Все туры · Поиск туров и приключений</div>
<section class='hero'><div class='hbg'>${heroSvg()}</div><h1>Поиск туров и приключений</h1>
<div class='kinds' role='tablist' aria-label='Тип туров'>${[['multi','Многодневные'],['one','Однодневные'],['odd','Необычные']].map(k=>`<button type='button' role='tab' data-kind='${k[0]}'>${k[0]=='odd'?"<i class='kb'></i>":''}${k[1]}</button>`).join('')}</div>
<div class='search' role='search'><div class='sf' id='sq'>${IS}<input id='q' placeholder='Куда?' autocomplete='off' aria-label='Куда'><div class='sg' id='sg' hidden></div></div><button type='button' class='sf sd' id='dw' aria-haspopup='dialog' aria-expanded='false'>${IC}<span id='dl'>Когда?</span></button><button type='button' id='go'>Найти туры</button><div class='pbd' id='pbd' hidden></div><div class='pop' id='pop' role='dialog' aria-label='Выбор дат' hidden></div></div></section>
<div class='chips'>${chips.map(c=>`<button class='chip' data-chip='${c[0]}'><i style='font-style:normal'>${c[1]}</i>${c[2]}</button>`).join('')}</div>
${rec.length?`<h2 class='h2s'>Вы недавно смотрели</h2><div class='recent'>${rec.map(id=>T.find(x=>x.id==id)).filter(Boolean).map(t=>`<a class='rc' href='#/tour/${t.id}'><i style='background:${art(t)}'></i><span>${t.t}</span></a>`).join('')}</div>`:''}
<div class='main'><aside><button class='btn-o fbtn' id='ft'>Фильтры <b id='fc'></b></button><button class='reset' id='rs'>Сбросить все фильтры (<span id='rn'>0</span>) ✕</button><div class='filters' id='fl'>${side}</div></aside>
<section><div class='bar'><div id='cnt'></div><div class='barr'><label>Сортировать: <select id='sort'>${[['pop','По популярности'],['cheap','Сначала дешёвые'],['exp','Сначала дорогие'],['rate','По рейтингу'],['disc','По размеру скидки'],['short','Сначала короткие'],['long','Сначала длинные']].map(o=>`<option value='${o[0]}' ${F.sort==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label><span class='vw'><button data-v='list' aria-label='Список'>☰</button><button data-v='grid' aria-label='Плитка'>▦</button></span></div></div>
<div class='pills' id='pills'></div><div class='grid' id='grid'></div>
<div class='banner'><h2>Более 220 локаций и направлений</h2><p>Организаторы проходят проверку, оплата любой картой, предоплата от 20%.</p></div></section></div>`;
 const fl=$('#fl');
 fl.addEventListener('input',e=>{const t=e.target,d=t.dataset;
  if(d.k)F[d.k]=t.checked;
  else if(d.m)F[d.m]=[...fl.querySelectorAll(`[data-m='${d.m}']:checked`)].map(x=>x.value);
  else if(d.n){const v=+t.value;F[d.n]=v||(d.n=='min'?1:d.n=='max'?32:0)}
  else if(d.p){const v=+t.value;F[d.p]=v>0?Math.round(v/CUR.R[CUR.code][0]):0}
  else if(d.s)F[d.s]=d.s=='grp'?+t.value:t.value;
  else return;
  list();paint2()});
 const paint2=()=>{fl.querySelectorAll('[data-pb]').forEach(b=>{const x=PB[+b.dataset.pb];b.classList.toggle('on',F.pmin==x[0]&&F.pmax==x[1])})};
 fl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ppl)F.ppl=Math.max(0,Math.min(20,F.ppl+ +b.dataset.ppl));
  else if(b.dataset.pb!==undefined){const x=PB[+b.dataset.pb],on=F.pmin==x[0]&&F.pmax==x[1];F.pmin=on?0:x[0];F.pmax=on?0:x[1]}
  else if(b.id=='alt'){const m=fl.querySelector('.more');m.hidden=!m.hidden;b.textContent=m.hidden?`Все типы (${LODS.length})`:'Свернуть';return}
  else if(b.id=='fx'||b.id=='fap'){fl.classList.remove('show');document.body.classList.remove('lock');return}
  else return;
  paint();list()});
 $('#ft').onclick=()=>{fl.classList.add('show');document.body.classList.add('lock')};
 $('#rs').onclick=resetAll;
 $('#go').onclick=doSearch;
 $('#q').onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();doSearch()}};
 $('#q').oninput=sgShow;$('#q').onfocus=()=>{closePop();sgShow()};
 $('#sg').onmousedown=e=>e.preventDefault();
 $('#sg').onclick=e=>{const b=e.target.closest('[data-sg]');if(!b)return;$('#q').value=b.dataset.sg;doSearch()};
 $('#dw').onclick=()=>{if($('#pop').hidden)openPop();else closePop()};
 $('#pop').onclick=popClick;$('#pbd').onclick=closePop;
 $('#sort').onchange=e=>{F.sort=e.target.value;list()};
 document.querySelectorAll('.kinds button').forEach(b=>b.onclick=()=>{F.kind=b.dataset.kind;list()});
 document.querySelectorAll('.vw button').forEach(b=>b.onclick=()=>{F.view=b.dataset.v;list()});
 document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{const k=b.dataset.chip;
  if(k=='short')F.max=F.max==3?32:3;else if(TOG[k]!==undefined)F[k]=!F[k];else F.types=F.types.includes(k)?[]:[k];paint();list()});
 paint();list()}

/* ---- «Подберите мне тур»: тоже без пустых результатов ---- */
function pick(){page('Подберите мне тур',`<div class="two" style="grid-template-columns:320px 1fr"><div class="card2"><label>Бюджет<select id="pb"><option value="0">Любой</option><option value="40000">До 40 000 ₽</option><option value="100000">До 100 000 ₽</option></select></label><label>Длительность<select id="pd"><option value="0">Любая</option><option value="3">До 3 дней</option><option value="7">До 7 дней</option><option value="99">8 дней и больше</option></select></label><label>Тип<select id="pt"><option value="">Любой</option>${types.map(t=>`<option>${t}</option>`).join('')}</select></label></div><div class="grid" id="grid" style="grid-template-columns:1fr 1fr"></div></div>`);
 const u=()=>{const b=+$('#pb').value,d=+$('#pd').value,ty=$('#pt').value,C=[['бюджет',t=>!b||t.p<=b],['длительность',t=>!d||(d==99?t.d>7:t.d<=d)],['тип тура',t=>!ty||t.type==ty]],
  rk=T.map(t=>({t,miss:C.filter(c=>!c[1](t)).map(c=>c[0])})),ex=rk.filter(x=>!x.miss.length);let near=[];
  if(ex.length<MINR)near=rk.filter(x=>x.miss.length).sort((a,c)=>a.miss.length-c.miss.length||c.t.n-a.t.n).slice(0,MINR-ex.length);
  $('#grid').innerHTML=ex.map(x=>card(x.t)).join('')+(near.length?`<div class='note'><b>${ex.length?'Точно подходит: '+ex.length+' '+pt(ex.length)+'.':'Точных совпадений нет.'}</b> Вот ближайшие варианты: на каждом отмечено, что не совпадает.</div>`+near.map(x=>card(x.t,x.miss)).join(''):'')};
 ['pb','pd','pt'].forEach(i=>$('#'+i).onchange=u);u()}


hdr();
addEventListener('hashchange',route);
$('#theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};

route();
</script>
